<!--
  ===== 怎么加照片 =====
  1. 把图片丢进 source/album/ 文件夹（jpg / png / webp / gif / avif 都行）
  2. 重新生成，照片会按「拍摄时间」自动排好，最新的排最前面
     （读 EXIF，没有就用文件修改时间），说明文字默认用文件名
  3. 想改顺序 / 换说明文字 / 用 CDN 外链：编辑 source/_data/album.yml
     （写进去的按里面的顺序排，没写的按时间排在后面）
  4. 上面那行 ALBUM 占位符会被自动替换成照片墙，别删掉
-->

<style>
/* ================= 相册页 ================= */

/* 隐藏蝴蝶主题自带的页面标题（用下面自定义的标题取代） */
.type-album .page-title { display: none; }

.type-album .layout { max-width: 1300px; }

.type-album #page { padding: 24px 22px 40px; }

@media (max-width: 768px) {
  .type-album #page { padding: 22px 14px 34px; }
}

.album-page {

}

[data-theme="dark"] .album-page {
  --album-accent: #ff9a8d;
}

.album-header {
  position: relative;
  padding: 4px 0 32px;
  isolation: isolate;
}

/* 淡淡的网格背景，向左上角聚拢后淡出 */
.album-header::before {
  content: "";
  position: absolute;
  inset: -30px -26px auto;
  height: 230px;
  z-index: -1;
  pointer-events: none;
  background-image:

  background-size: 34px 34px;
  -webkit-mask-image: radial-gradient(130% 110% at 0% 0%, #000 15%, transparent 72%);
  mask-image: radial-gradient(130% 110% at 0% 0%, #000 15%, transparent 72%);
}

.album-eyebrow {

  font-size: 1.1rem;
  font-weight: 800;
  line-height: 1;

.album-title {

  padding: 0;
  font-size: 2.3rem;
  font-weight: 800;

}

@media (min-width: 768px) {

/* ---------- 照片墙 ---------- */
#photos.album-grid {
  columns: 2;

  margin-top: 10px;
}

/* 一张照片都没有时的提示 */
.album-empty {

  font-size: .95rem;
  opacity: .6;
}

@media (min-width: 640px) {
  #photos.album-grid { columns: 3; }
}

.album-item {
  position: relative;
  margin: 0 0 2px;
  border-radius: 10px;
  overflow: hidden;
  break-inside: avoid;
  -webkit-column-break-inside: avoid;
  transition: transform .3s ease, filter .3s ease;
}

/* 只有真的停在某张照片上时，其余照片才缩小 + 模糊。
   :has() 是关键：鼠标在照片缝隙、卡片空白处时，不算「聚焦某张」，全部保持清晰 */
@media (hover: hover) {
  .album-grid:has(.album-item:hover) .album-item:not(:hover) {
    transform: scale(.98);
    filter: blur(4px);
  }
}

/* 载入时逐张淡入 */
.album-fade {
  position: relative;
  display: block;
  opacity: 0;
  transform: translateY(6px);
  filter: blur(6px);
  animation: album-in .7s cubic-bezier(.22, .61, .36, 1) forwards;
  animation-delay: calc(.2s + var(--i, 0) * .05s);
}

@keyframes album-in {
  to {
    opacity: 1;
    transform: none;
    filter: blur(0);
  }
}

@media (prefers-reduced-motion: reduce) {

    transform: none;
    filter: none;
